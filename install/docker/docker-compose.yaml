# Assumes tender-bid-api.mg2.eglb.intel.com / tender-bid.mg2.eglb.intel.com are already fronted
# by a reverse proxy that terminates TLS and forwards to these containers' published ports —
# neither service here serves HTTPS itself.
#
# Setup:
#   cp .env.example .env                 # Postgres credentials — read by Compose itself for
#                                         # the ${...} substitution below, separate from backend.env
#   cp backend.env.example backend.env   # then fill in every value — this file is gitignored,
#                                         # never commit real secrets into this directory
#   cp litellm.env.example litellm.env   # LiteLLM proxy's own master key + ANTHROPIC_API_KEY
#   docker compose -f install/docker/docker-compose.yaml up -d --build
#   curl -X POST http://localhost:8011/setup/database   # one-time: creates tables + bootstrap admin
#
# The NPU-served Qwen3 (llama.cpp, :8000) and GPU-served LightOnOCR (:8010) model servers are
# host-native processes, not containers (they need direct device access) — the `litellm` service
# reaches them via host.docker.internal (extra_hosts below maps that to the host gateway on Linux).
#
# Run from the repo root (build.context below is relative to this compose file, i.e. ../..).

# Without an explicit name, Compose derives the project (and network) name from this file's
# directory — "docker" — which collides with any other project also run out of a directory
# named "docker" (both end up wanting a network called docker_default). Pinning it here avoids
# that collision entirely.
name: tender-bid

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published for host-side JDBC/psql/pgAdmin access. This stack sits on public DNS, so if
    # this host's 5432 is reachable from the internet, restrict it (e.g. a firewall rule scoped
    # to your own IP) rather than leaving it open to everyone.
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # LightOnOCR-2-1B on the Intel GPU. /dev/dxg + the /usr/lib/wsl mount are WSL2's
  # GPU-passthrough plumbing, which Docker Desktop's VM exposes to containers.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-intel
    environment:
      ZES_ENABLE_SYSMAN: "1"
    devices:
      - /dev/dxg
    volumes:
      - ../../../models:/models:ro
      - /usr/lib/wsl:/usr/lib/wsl
    command: >
      -m /models/lightonocr-bbox/LightOnOCR-2-1B-bbox-Q4_K_M.gguf
      --mmproj /models/lightonocr-bbox/mmproj-BF16.gguf
      -ngl 99 -np 4 -c 65536 -b 8192 -ub 2048 -fa on
      --mtmd-batch-max-tokens 2048
      --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    env_file:
      - ./litellm.env
    environment:
      # On bridge networking, the `postgres` service is resolvable via compose DNS.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      llama-server:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: pydantic_backend/Dockerfile
    env_file:
      - ./backend.env
    environment:
      # Wired to the bundled `postgres` service above — not in backend.env, so the two can
      # never drift out of sync. Pointing this backend at a different (e.g. external/managed)
      # Postgres instead just means: delete the postgres service above and set DATABASE_URL
      # directly in backend.env instead.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Lets npu_run.bat / groq_run.bat pick the fast tier without editing backend.env.
      LITELLM_FAST_MODEL: ${LITELLM_FAST_MODEL:-npu-qwen3-4b}
    volumes:
      # Gmail/Drive OAuth refresh token — written and refreshed by the app at runtime, so this
      # must be read-write, not read-only. Matches GMAIL_TOKEN_PATH's default of
      # .secrets/gmail-token.json, resolved relative to the container's WORKDIR (/app).
      - ../../.secrets:/app/.secrets
    # Reaches the LightOnOCR parsing service (:8010, host-native) the same way `litellm` reaches
    # the NPU model server — see the extra_hosts note on that service above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8011:8011"
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time (see frontend/Dockerfile) — changing this
        # requires `docker compose build frontend` again, not just a restart.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8011
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
