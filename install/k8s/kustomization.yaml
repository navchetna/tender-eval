# Deploy with `kubectl apply -k install/k8s` — but read README.md first: the two images must
# be built (and pushed, if using a registry), and the two secrets created, before anything
# here will start.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tender-bid

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

# Default here: images built locally with nerdctl straight into the k8s.io containerd
# namespace (no registry — see README.md step 1), so newName just keeps the bare local
# image name and newTag picks the tag used at build time. If you push to a real registry
# instead, set newName to that registry path and switch imagePullPolicy back to Always in
# backend.yaml / frontend.yaml.
images:
  - name: tender-bid-backend
    newName: tender-bid-backend
    newTag: local
  - name: tender-bid-frontend
    newName: tender-bid-frontend
    newTag: local
