# Where every namespaced resource in this chart lands. The chart does NOT create
# this namespace itself (templating a Namespace resource causes Helm ownership
# conflicts if anything else ever touches it) — pass --namespace pdf-pipeline
# --create-namespace on install instead (see README.md), keeping this in sync.
namespaceOverride: pdf-pipeline

image:
  repository: navchetna/pdf-pipeline
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  port: 8010
  targetPort: 8000

# Set to false once you front this with the ingress below (or your own) — the
# NodePort is handy for a first bring-up without DNS/TLS in place yet.
nodePort:
  enabled: true
  port: 30010

# VLM_URL: routed through the toolkit's own LiteLLM gateway so every OCR call is authenticated, rate-limited, and shows up in the
# gateway's own request logs/spend tracking like every other model call in this
# deployment — see ../lighton-ocr/ for where "lightonai/LightOnOCR-2-1B" gets
# registered on the gateway in the first place.
vlmUrl: "http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/v1/chat/completions"

# A dedicated LiteLLM key for this pipeline's own OCR calls (kept separate from
# tender-eval's ADMIN_LITELLM_KEY/LITELLM_WORKER_API_KEY, which are for the LLM
# evaluation calls, not OCR). Create it once and store it in this Secret before
# installing:
#
#   MASTER=$(kubectl get deploy -n genai-gateway genai-gateway-deployment \
#     -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="LITELLM_MASTER_KEY")].value}')
#   KEY=$(kubectl run litellm-mint-pdfpipeline --rm -i --restart=Never --quiet --image=curlimages/curl -- \
#     curl -s -X POST http://genai-gateway-service.genai-gateway.svc.cluster.local:4000/key/generate \
#       -H "Authorization: Bearer $MASTER" -H "Content-Type: application/json" \
#       -d "{\"key_alias\": \"pdf-pipeline-vlm-$(date +%s)\"}" | jq -r '.key')
#   # timestamp suffix: LiteLLM enforces unique key_alias values, so a fixed alias fails with
#   # a 400 on every retry after the first successful mint — and jq -r '.key' on that error
#   # response silently becomes the literal string "null", so verify before using it:
#   echo "$KEY" | grep -qE '^sk-' || { echo "Mint failed — got: $KEY" >&2; exit 1; }
#   kubectl create secret generic pdf-pipeline-litellm --namespace pdf-pipeline \
#     --from-literal=api-key="$KEY"
vlmApiKeySecret:
  name: pdf-pipeline-litellm
  key: api-key

persistence:
  outputs:
    size: 10Gi
    storageClassName: ""   # cluster default if empty
  db:
    size: 1Gi
    storageClassName: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Exposes the pipeline under the SAME gateway host tender-eval's own README
# already documents (PARSER_BASE_URL=https://<cluster_url>/pdf-pipeline) —
# set ingress.host to that cluster_url. Disable if you're only reaching this
# via the NodePort above, or via your own ingress/APISIX route.
ingress:
  enabled: true
  ingressClassName: nginx
  host: ""              # e.g. ei-api.mg2.eglb.intel.com — same host as LITELLM_BASE_URL
  path: /pdf-pipeline
  tlsSecretName: ""      # leave empty to disable TLS on this Ingress resource
