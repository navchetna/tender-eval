# Values file for the TOOLKIT'S OWN chart (enterprise-agent-toolkit/core/helm-charts/vllm),
# not a chart of its own. Install with:
#
#   helm upgrade --install vllm-lighton-ocr-cpu <path-to-toolkit>/core/helm-charts/vllm \
#     --values vllm-model-values.yaml \
#     --set global.HUGGINGFACEHUB_API_TOKEN=<hf_token>
#
# VLLM_CPU_KVCACHE_SPACE, VLLM_CPU_OMP_THREADS_BIND, cpu, and memory below are tuned for one
# specific server — re-derive them for yours: `lscpu` for NUMA/core layout, `htop` for free
# memory, before deploying.

accelDevice: ""
cpu_balloon_annotation: ""

resources:
  requests:
    cpu: "{{ .Values.cpu }}"
    memory: "{{ .Values.memory }}"

block_size: 128
d_type: "bfloat16"
max_model_len: 32768

image:
  repository: vllm/vllm-openai-cpu
  tag: "v0.23.0"
  pullPolicy: IfNotPresent

# Same node affinity the toolkit uses for every Xeon inference deployment —
# adjust or drop if this cluster doesn't label nodes ei-inference-eligible=true.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: ei-inference-eligible
              operator: In
              values: ["true"]

VLLM_CPU_SGL_KERNEL: "1"
VLLM_NO_USAGE_STATS: 1
DO_NOT_TRACK: 1

LLM_MODEL_ID: "lightonai/LightOnOCR-2-1B"

modelConfigs:
  "lightonai/LightOnOCR-2-1B":
    configMapValues:
      # Single rank now (tensor_parallel_size=1 below — see the note on that),
      # so this is the whole pod's KV cache budget, not split/doubled across
      # ranks. Back to the toolkit's own original single-rank default of "40"
      # (was briefly "20" while running tensor_parallel_size=2, which applied
      # this per rank and doubled the real memory footprint — see git history
      VLLM_CPU_KVCACHE_SPACE: "40"
      VLLM_RPC_TIMEOUT: "100000"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
      VLLM_CPU_NUM_OF_RESERVED_CPU: "1"
      VLLM_CPU_SGL_KERNEL: "0"
      HF_HUB_DISABLE_XET: "1"
      TRITON_CACHE_DIR: "/tmp/.triton"
      USER: "vllm"
      # SINGLE rank (tensor_parallel_size=1 below), all 48 physical cores from
      # BOTH NUMA node 0 and node 1 (HT siblings still deliberately excluded).
      VLLM_CPU_OMP_THREADS_BIND: "0-47"   # single rank, node0+node1 physical cores, no HT
    extraCmdArgs:
      [
        "--block-size",
        "128",
        "--dtype",
        "bfloat16",
        "--max-model-len",
        "32768",
        "--distributed_executor_backend",
        "mp",
        "--enable_chunked_prefill",
        "--enforce-eager",
        "--max-num-batched-tokens",
        "32768",
        "--max-num-seqs",
        "64",
        "--limit-mm-per-prompt",
        '{"image":1}',
        "--mm-processor-cache-gb",
        "0",
        "--trust_remote_code",
        "--no-enable-prefix-caching",
      ]
    tensor_parallel_size: "{{ .Values.tensor_parallel_size }}"
    pipeline_parallel_size: "{{ .Values.pipeline_parallel_size }}"

cpu: "48"
memory: "96Gi"
tensor_parallel_size: "1"
pipeline_parallel_size: "1"

# Required by the chart's deployment.yaml template even though our
# modelConfigs entry above always matches (it falls back to this map's
# .extraCmdArgs when a model isn't found in modelConfigs, and evaluates that
# lookup unconditionally) — copied verbatim from the toolkit's own
# xeon-values.yaml so this values file renders standalone.
defaultModelConfigs:
  configMapValues:
    VLLM_CPU_KVCACHE_SPACE: "40"
    VLLM_RPC_TIMEOUT: "100000"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_ENGINE_ITERATION_TIMEOUT_S: "120"
    VLLM_CPU_NUM_OF_RESERVED_CPU: "0"
    VLLM_CPU_SGL_KERNEL: "1"
    HF_HUB_DISABLE_XET: "1"
    TORCH_INDUCTOR_CACHE_DIR: "/tmp/torchinductor_cache"
    TRITON_CACHE_DIR: "/tmp/.triton"
    USER: "vllm"
  extraCmdArgs:
    [
      "--block-size",
      "128",
      "--dtype",
      "bfloat16",
      "--distributed_executor_backend",
      "mp",
      "--enable_chunked_prefill",
      "--enforce-eager",
      "--max-num-batched-tokens",
      "2048",
      "--max-num-seqs",
      "128",
      "--enable-prefix-caching",
    ]
  tensor_parallel_size: "{{ .Values.tensor_parallel_size }}"
  pipeline_parallel_size: "{{ .Values.pipeline_parallel_size }}"
